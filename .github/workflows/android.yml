name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "**.py"
      - "buildozer.spec"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip             autoconf libtool pkg-config zlib1g-dev libncurses5-dev             libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev             build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Render app icon
        run: |
          python -m pip install cairosvg==2.7.1
          mkdir -p assets
          python -c "import cairosvg; cairosvg.svg2png(url='assets/icon.svg', write_to='assets/icon.png', output_width=512, output_height=512)"

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: list-spreadsheet-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
